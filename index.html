<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CharTech — สั่งซื้อสินค้า</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{
  --bg:#ffffff; --fg:#1b1b19; --muted:#6f6f68; --line:#e4e4df;
  --card:#faf9f6; --accent:#2f6b3f; --accent-fg:#ffffff;
  --warn-bg:#fff6e5; --warn-fg:#8a5a00; --danger:#b42318;
  --pad-t:env(safe-area-inset-top,0px); --pad-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141412; --fg:#f0efea; --muted:#9d9d95; --line:#2d2d29;
  --card:#1e1e1b; --accent:#57a06a; --accent-fg:#0d1a10;
  --warn-bg:#3a2e14; --warn-fg:#f0c674;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;
  line-height:1.5;display:flex;flex-direction:column;padding-top:var(--pad-t)}
header{position:sticky;top:var(--pad-t);z-index:10;background:var(--bg);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 14px}
#back{border:0;background:none;color:var(--fg);font-size:1.4rem;padding:2px 6px;cursor:pointer;visibility:hidden}
#title{flex:1;font-weight:600;font-size:1rem;margin:0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--fg);
  border-radius:999px;padding:4px 10px;font-size:.78rem;cursor:pointer}
#cartBtn{position:relative;background:var(--accent);color:var(--accent-fg);border:0;
  border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:600;cursor:pointer}
#cartCount{font-variant-numeric:tabular-nums}
main{flex:1;overflow-y:auto;padding:14px 14px calc(20px + var(--pad-b))}
.row{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:14px;margin-bottom:10px;display:flex;align-items:center;
  gap:12px;cursor:pointer;color:var(--fg);font-size:.95rem}
.row:active{transform:scale(.99)}
.row .grow{flex:1;min-width:0}
.row .sub{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
.row .price{font-weight:600;white-space:nowrap}
.row .arrow{color:var(--muted)}
.notice{background:var(--warn-bg);color:var(--warn-fg);border-radius:10px;
  padding:10px 12px;font-size:.82rem;margin-bottom:12px}
.qtyWrap{text-align:center;padding:20px 0}
.qtyName{font-size:1.05rem;font-weight:600}
.qtyPrice{color:var(--muted);margin:4px 0 22px}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:22px}
.stepper button{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);
  background:var(--card);color:var(--fg);font-size:1.6rem;cursor:pointer}
.stepper input{width:88px;height:52px;text-align:center;font-size:1.3rem;font-weight:600;
  border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.primary{width:100%;background:var(--accent);color:var(--accent-fg);border:0;border-radius:12px;
  padding:15px;font-size:1rem;font-weight:600;cursor:pointer}
.primary[disabled]{opacity:.45}
.ghost{width:100%;background:none;color:var(--fg);border:1px solid var(--line);
  border-radius:12px;padding:13px;font-size:.95rem;margin-top:10px;cursor:pointer}
.cartItem{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.cartItem .grow{flex:1;min-width:0}
.cartItem .nm{font-size:.9rem}
.cartItem .sub{color:var(--muted);font-size:.78rem}
.mini{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);
  background:var(--card);color:var(--fg);font-size:1.1rem;cursor:pointer}
.miniQty{min-width:26px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.totals{margin-top:16px;padding-top:14px;border-top:2px solid var(--line);
  display:flex;justify-content:space-between;font-size:1.05rem;font-weight:700}
.empty{text-align:center;color:var(--muted);padding:50px 0}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:5px}
.fld input,.fld textarea{width:100%;padding:12px;font-size:1rem;border:1px solid var(--line);
  border-radius:10px;background:var(--bg);color:var(--fg);font-family:inherit}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);color:var(--fg);font-size:.9rem;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.cons{display:flex;gap:10px;align-items:flex-start;font-size:.82rem;color:var(--muted);line-height:1.45}
.cons input{margin-top:3px;width:18px;height:18px;flex:none}
.sumline{display:flex;justify-content:space-between;padding:7px 0;font-size:.92rem;color:var(--muted)}
.rvw{margin-top:18px;padding:12px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;font-size:.88rem;line-height:1.6}
.rm{color:var(--danger);background:none;border:0;font-size:.78rem;cursor:pointer;padding:4px}
</style>
</head>
<body>

<header>
  <button id="back" aria-label="back">&#8249;</button>
  <h1 id="title">CharTech</h1>
  <button class="chip" id="langBtn">EN</button>
  <button id="cartBtn">&#128722; <span id="cartCount">0</span></button>

<main id="main"><div class="empty" id="boot">กำลังโหลด… / Loading…</div></main>

<script>
/* ============ PASTE YOUR TWO VALUES HERE ============ */
const LIFF_ID     = "PASTE_YOUR_LIFF_ID_HERE";
const CATALOGUE_URL = "PASTE_YOUR_CATALOGUE_CSV_URL_HERE";

/* Shipping tiers — mirror of Config!B13:B20. If you change Config, change these too. */
const SHIP = [[2.5,60],[6,90],[11,150],[22,280]];
const FREIGHT_OVER = 22;
/* =================================================== */

/* Fallback catalogue — used only if the live fetch fails.
   Order: sku, groupTH, groupEN, lineTH, lineEN, optTH, optEN, price, weight, sort */
const FALLBACK = [

["WV-1000","น้ำส้มควันไม้","Wood vinegar","บริสุทธิ์ 100%","Pure 100%","1 ลิตร","1 L",149,1.1,202],
["WV-5L","น้ำส้มควันไม้","Wood vinegar","บริสุทธิ์ 100%","Pure 100%","ถัง 5 ลิตร","5 L jug",450,5.4,203],
["WV-20L","น้ำส้มควันไม้","Wood vinegar","บริสุทธิ์ 100%","Pure 100%","แกลลอน 20 ลิตร","20 L jerrycan",790,21.6,204],
["WV-200L","น้ำส้มควันไม้","Wood vinegar","บริสุทธิ์ 100%","Pure 100%","ถัง 200 ลิตร","200 L drum",5500,213,205],
["WV-SPR-500","น้ำส้มควันไม้","Wood vinegar","สเปรย์พร้อมใช้","Ready spray","500 มล.","500 ml",149,0.6,211],
["CH-OD-200","ถ่านพิเศษ","Specialty","ถ่านดูดกลิ่น","Odour absorbing","200 กรัม","200 g",79,0.3,301],
["CH-WF-1","ถ่านพิเศษ","Specialty","ถ่านกรองน้ำ","Water filtration","1 กก.","1 kg",139,1.2,311],
["ASH-1","ถ่านพิเศษ","Specialty","ขี้เถ้าไม้","Wood ash","1 กก.","1 kg",45,1.2,321],
["SOIL-5","สวน","Garden","ดินปลูก","Potting soil","5 กก.","5 kg",65,5.4,401],
["SEED-1","สวน","Garden","กล้าไม้","Seedling","1 ต้น","1 plant",50,1,411],
["HY-CIT-250","สวน","Garden","น้ำกลั่นสมุนไพร","Hydrosol","ตะไคร้หอม 250 มล.","Citronella 250 ml",139,0.35,421],
["HY-ROS-250","สวน","Garden","น้ำกลั่นสมุนไพร","Hydrosol","โรสแมรี่ 250 มล.","Rosemary 250 ml",179,0.35,422]
];

const T = {
  th:{pick:"เลือกหมวดสินค้า",picktype:"เลือกประเภท",picksize:"เลือกขนาด",qty:"จำนวน",
      cart:"ตะกร้าสินค้า",add:"ใส่ตะกร้า",cont:"เลือกสินค้าต่อ",checkout:"ดำเนินการสั่งซื้อ",
      empty:"ยังไม่มีสินค้าในตะกร้า",total:"รวม",each:"ต่อชิ้น",items:"รายการ",
      offline:"ใช้ราคาสำรอง ราคาจริงจะยืนยันอีกครั้งทางแชท",
      nol:"เปิดจากแอป LINE เพื่อสั่งซื้อ",rm:"ลบ",
      details:"ข้อมูลผู้สั่งซื้อ",review:"ตรวจสอบคำสั่งซื้อ",otype:"ประเภทการสั่งซื้อ",
      retail:"ซื้อปลีก",whole:"ซื้อส่ง (50 ชิ้นขึ้นไป)",nm:"ชื่อ-นามสกุล",ph:"เบอร์โทรศัพท์",
      addr:"ที่อยู่จัดส่ง พร้อมรหัสไปรษณีย์",note:"หมายเหตุเพิ่มเติม",
      consent:"ยินยอมให้เก็บและใช้ข้อมูล ชื่อ เบอร์โทร ที่อยู่ เพื่อการจัดส่งและติดต่อเรื่องคำสั่งซื้อเท่านั้น",
      ship:"ค่าจัดส่ง",sub:"ยอดสินค้า",freight:"แจ้งค่าส่งภายหลัง",next:"ถัดไป",
      submit:"ยืนยันคำสั่งซื้อ",back2:"แก้ไข",
      wnote:"ทีมงานจะติดต่อกลับพร้อมใบเสนอราคาภายใน 24 ชม. ราคาขายส่งไม่แสดงในหน้านี้",
      fnote:"น้ำหนักเกิน 22 กก. ทีมงานจะแจ้งค่าขนส่งให้ทราบก่อนชำระเงิน",
      errnm:"กรุณากรอกชื่อ",errph:"เบอร์โทรไม่ถูกต้อง เช่น 0812345678",
      erraddr:"กรุณากรอกที่อยู่",errcon:"กรุณายอมรับเงื่อนไขข้อมูลส่วนบุคคล",
      sending:"กำลังส่ง…",okttl:"รับคำสั่งซื้อแล้ว",
      okmsg:"ทีมงานจะแจ้งยอดรวมและ QR พร้อมเพย์ให้ทางแชท LINE ครับ",
      okw:"ทีมงานจะติดต่อกลับพร้อมใบเสนอราคาครับ",
      failttl:"ส่งไม่สำเร็จ",failmsg:"กรุณาลองใหม่ หรือทักแชทหาแอดมินได้เลยครับ",
      notwired:"ยังไม่ได้เชื่อมต่อระบบ (ขั้นตอน 11D)",close:"ปิด"},
  en:{pick:"Choose a category",picktype:"Choose a type",picksize:"Choose a size",qty:"Quantity",
      cart:"Your cart",add:"Add to cart",cont:"Keep shopping",checkout:"Continue to checkout",
      empty:"Your cart is empty",total:"Total",each:"each",items:"items",
      offline:"Using backup prices. Final price confirmed in chat.",
      nol:"Open inside LINE to place an order",rm:"Remove",
      details:"Your details",review:"Review your order",otype:"Order type",
      retail:"Retail",whole:"Wholesale (50+ units)",nm:"Full name",ph:"Phone number",
      addr:"Delivery address with postcode",note:"Additional notes",
      consent:"I consent to my name, phone and address being used for delivery and order communication only",
      ship:"Shipping",sub:"Items",freight:"Quoted separately",next:"Next",
      submit:"Place order",back2:"Edit",
      wnote:"We will reply with a quotation within 24 hours. Wholesale prices are not shown here.",
      fnote:"Over 22 kg — we will confirm freight cost before payment",
      errnm:"Please enter your name",errph:"Invalid phone, e.g. 0812345678",
      erraddr:"Please enter your address",errcon:"Please accept the data consent",
      sending:"Sending…",okttl:"Order received",
      okmsg:"We will send your total and PromptPay QR in the LINE chat.",
      okw:"We will contact you with a quotation.",
      failttl:"Could not send",failmsg:"Please try again, or message us in chat.",
      notwired:"Not connected yet (step 11D)",close:"Close"}
};

const S = {lang:"th", screen:"groups", group:null, line:null, sku:null, qty:1,
           rows:[], cart:[], offline:false, profile:null, idToken:null,
           f:{otype:"RETAIL",nm:"",ph:"",addr:"",note:"",consent:false}, err:"", sending:false};

const $ = (id)=>document.getElementById(id);
const t = (k)=>T[S.lang][k];
const baht = (n)=>"฿"+n.toLocaleString("en-US",{minimumFractionDigits:(n%1?2:0),maximumFractionDigits:2});
const esc = (s)=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function parseCSV(txt){
  const out=[]; let row=[], cur="", q=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===","){ row.push(cur); cur=""; }
    else if(c==="\n"){ row.push(cur); out.push(row); row=[]; cur=""; }
    else if(c!=="\r") cur+=c;
  }
  if(cur!==""||row.length){ row.push(cur); out.push(row); }
  return out;
}

function toRows(arr){
  return arr.filter(r=>r.length>=10 && r[0] && r[0]!=="SKU").map(r=>({
    sku:r[0], gTH:r[1], gEN:r[2], lTH:r[3], lEN:r[4], oTH:r[5], oEN:r[6],
    price:parseFloat(String(r[7]).replace(/[^0-9.]/g,""))||0,
    weight:parseFloat(r[8])||0, sort:parseInt(r[9],10)||999
  })).sort((a,b)=>a.sort-b.sort);
}

async function loadCatalogue(){
  try{
    if(CATALOGUE_URL.indexOf("PASTE")===0) throw new Error("no url");
    const res = await fetch(CATALOGUE_URL,{cache:"no-store"});
    if(!res.ok) throw new Error(res.status);
    const rows = toRows(parseCSV(await res.text()));
    if(!rows.length) throw new Error("empty");
    S.rows = rows;
  }catch(e){
    S.offline = true;
    S.rows = toRows(FALLBACK.map(r=>r.map(String)));
  }
}

const groups = ()=>{const s=new Set(),o=[];S.rows.forEach(r=>{if(!s.has(r.gEN)){s.add(r.gEN);o.push(r);}});return o;};
const lines  = (g)=>{const s=new Set(),o=[];S.rows.filter(r=>r.gEN===g).forEach(r=>{if(!s.has(r.lEN)){s.add(r.lEN);o.push(r);}});return o;};
const opts   = (g,l)=>S.rows.filter(r=>r.gEN===g&&r.lEN===l);
const gName  = (r)=>S.lang==="th"?r.gTH:r.gEN;
const lName  = (r)=>S.lang==="th"?r.lTH:r.lEN;
const oName  = (r)=>S.lang==="th"?r.oTH:r.oEN;
const full   = (r)=>lName(r)+" · "+oName(r);
const cartQty= ()=>S.cart.reduce((n,i)=>n+i.qty,0);
const cartSum= ()=>S.cart.reduce((n,i)=>n+i.qty*i.price,0);

const cartWeight=()=>S.cart.reduce((n,i)=>n+i.qty*i.weight,0);
function shipFor(w){ if(w>FREIGHT_OVER) return null; for(const [mx,fee] of SHIP){ if(w<=mx) return fee; } return null; }
function grandTotal(){ const s=shipFor(cartWeight()); return cartSum() + (s||0); }

function go(screen){ S.screen=screen; render(); }

function addToCart(){
  const r = S.rows.find(x=>x.sku===S.sku);
  const ex = S.cart.find(i=>i.sku===S.sku);
  if(ex) ex.qty += S.qty; else S.cart.push({sku:r.sku,name:full(r),price:r.price,weight:r.weight,qty:S.qty});
  S.qty=1; go("cart");
}
function bump(sku,d){
  const i=S.cart.find(x=>x.sku===sku); if(!i) return;
  i.qty+=d; if(i.qty<1) S.cart=S.cart.filter(x=>x.sku!==sku);
  render();
}

function render(){
  const m=$("main"); let h="";
  $("langBtn").textContent = S.lang==="th" ? "EN" : "ไทย";
  $("cartCount").textContent = cartQty();
  $("back").style.visibility = (S.screen==="groups") ? "hidden" : "visible";

  const banner = S.offline ? '<div class="notice">'+t("offline")+'</div>' : "";

  if(S.screen==="groups"){
    $("title").textContent = t("pick");
    h = banner + groups().map(r=>
      '<button class="row" onclick="pickGroup(\''+r.gEN+'\')"><span class="grow">'+esc(gName(r))+'</span><span class="arrow">&#8250;</span></button>').join("");
  }
  else if(S.screen==="lines"){
    $("title").textContent = t("picktype");
    h = lines(S.group).map(r=>
      '<button class="row" onclick="pickLine(\''+r.lEN.replace(/'/g,"\\'")+'\')"><span class="grow">'+esc(lName(r))+'</span><span class="arrow">&#8250;</span></button>').join("");
  }
  else if(S.screen==="options"){
    $("title").textContent = t("picksize");
    h = opts(S.group,S.line).map(r=>
      '<button class="row" onclick="pickSku(\''+r.sku+'\')"><span class="grow">'+esc(oName(r))+
      '<span class="sub">'+esc(r.weight)+' kg</span></span><span class="price">'+baht(r.price)+'</span><span class="arrow">&#8250;</span></button>').join("");
  }
  else if(S.screen==="qty"){
    const r=S.rows.find(x=>x.sku===S.sku);
    $("title").textContent = t("qty");
    h = '<div class="qtyWrap"><div class="qtyName">'+esc(full(r))+'</div>'+
        '<div class="qtyPrice">'+baht(r.price)+' '+t("each")+'</div>'+
        '<div class="stepper"><button onclick="setQty(-1)">&minus;</button>'+
        '<input id="qtyIn" type="number" inputmode="numeric" min="1" value="'+S.qty+'" onchange="typeQty(this.value)">'+
        '<button onclick="setQty(1)">+</button></div>'+
        '<button class="primary" onclick="addToCart()">'+t("add")+' &middot; '+baht(r.price*S.qty)+'</button></div>';
  }
  else if(S.screen==="cart"){
    $("title").textContent = t("cart");
    if(!S.cart.length){ h='<div class="empty">'+t("empty")+'</div><button class="ghost" onclick="go(\'groups\')">'+t("cont")+'</button>'; }
    else{
      h = banner + S.cart.map(i=>
        '<div class="cartItem"><span class="grow"><span class="nm">'+esc(i.name)+'</span>'+
        '<span class="sub">'+baht(i.price)+' '+t("each")+' &middot; <button class="rm" onclick="bump(\''+i.sku+'\',-999)">'+t("rm")+'</button></span></span>'+
        '<button class="mini" onclick="bump(\''+i.sku+'\',-1)">&minus;</button>'+
        '<span class="miniQty">'+i.qty+'</span>'+
        '<button class="mini" onclick="bump(\''+i.sku+'\',1)">+</button>'+
        '<span class="price">'+baht(i.qty*i.price)+'</span></div>').join("")
        + '<div class="totals"><span>'+t("total")+'</span><span>'+baht(cartSum())+'</span></div>'
        + '<div style="margin-top:18px"><button class="primary" onclick="go(\'checkout\')">'+t("checkout")+'</button>'
        + '<button class="ghost" onclick="go(\'groups\')">'+t("cont")+'</button></div>';
    }
  }
  else if(S.screen==="checkout"){
    $("title").textContent = t("details");
    const f=S.f, w=cartWeight(), wholesale=(f.otype==="WHOLESALE");
    h = (S.err?'<div class="notice" style="background:#fde8e6;color:#b42318">'+esc(S.err)+'</div>':'')
      + '<div class="fld"><label>'+t("otype")+'</label><div class="seg">'
      + '<button class="'+(wholesale?'':'on')+'" onclick="setType(\'RETAIL\')">'+t("retail")+'</button>'
      + '<button class="'+(wholesale?'on':'')+'" onclick="setType(\'WHOLESALE\')">'+t("whole")+'</button></div></div>'
      + (wholesale?'<div class="notice">'+t("wnote")+'</div>':'')
      + (!wholesale && w>FREIGHT_OVER?'<div class="notice">'+t("fnote")+'</div>':'')
      + '<div class="fld"><label>'+t("nm")+'</label><input id="f_nm" value="'+esc(f.nm)+'" autocomplete="name"></div>'
      + '<div class="fld"><label>'+t("ph")+'</label><input id="f_ph" type="tel" inputmode="numeric" value="'+esc(f.ph)+'" placeholder="0812345678"></div>'
      + '<div class="fld"><label>'+t("addr")+'</label><textarea id="f_addr" rows="3">'+esc(f.addr)+'</textarea></div>'
      + '<div class="fld"><label>'+t("note")+'</label><textarea id="f_note" rows="2">'+esc(f.note)+'</textarea></div>'
      + '<label class="cons"><input type="checkbox" id="f_con"'+(f.consent?' checked':'')+'><span>'+t("consent")+'</span></label>'
      + '<button class="primary" style="margin-top:16px" onclick="toReview()">'+t("next")+'</button>';
  }
  else if(S.screen==="review"){
    $("title").textContent = t("review");
    const f=S.f, w=cartWeight(), wholesale=(f.otype==="WHOLESALE"), ship=shipFor(w);
    h = S.cart.map(i=>'<div class="cartItem"><span class="grow"><span class="nm">'+esc(i.name)+'</span>'
        +'<span class="sub">'+i.qty+' &times; '+baht(i.price)+'</span></span>'
        +'<span class="price">'+baht(i.qty*i.price)+'</span></div>').join("");
    if(wholesale){
      h += '<div class="notice" style="margin-top:14px">'+t("wnote")+'</div>';
    } else {
      h += '<div class="sumline"><span>'+t("sub")+'</span><span>'+baht(cartSum())+'</span></div>'
         + '<div class="sumline"><span>'+t("ship")+' ('+w.toFixed(1)+' kg)</span><span>'
         + (ship===null?t("freight"):baht(ship))+'</span></div>'
         + '<div class="totals"><span>'+t("total")+'</span><span>'
         + (ship===null?baht(cartSum())+" +":baht(grandTotal()))+'</span></div>'
         + (ship===null?'<div class="notice" style="margin-top:10px">'+t("fnote")+'</div>':'');
    }
    h += '<div class="rvw"><div><b>'+esc(f.nm)+'</b></div><div>'+esc(f.ph)+'</div>'
       + (f.addr?'<div>'+esc(f.addr)+'</div>':'') + (f.note?'<div class="sub">'+esc(f.note)+'</div>':'') + '</div>'
       + '<button class="primary" style="margin-top:18px" onclick="submitOrder()"'+(S.sending?' disabled':'')+'>'
       + (S.sending?t("sending"):t("submit"))+'</button>'
       + '<button class="ghost" onclick="go(\'checkout\')">'+t("back2")+'</button>';
  }
  else if(S.screen==="done"){
    $("title").textContent = "CharTech";
    $("back").style.visibility="hidden";
    h = '<div class="empty"><div style="font-size:2.6rem">&#127793;</div>'
      + '<h2 style="margin:10px 0 6px;color:var(--fg)">'+t("okttl")+'</h2>'
      + '<p>'+(S.f.otype==="WHOLESALE"?t("okw"):t("okmsg"))+'</p>'
      + '<button class="ghost" style="margin-top:20px" onclick="closeApp()">'+t("close")+'</button></div>';
  }
  else if(S.screen==="fail"){
    $("title").textContent = "CharTech";
    h = '<div class="empty"><h2 style="margin:10px 0 6px;color:var(--danger)">'+t("failttl")+'</h2>'
      + '<p>'+esc(S.err||t("failmsg"))+'</p>'
      + '<button class="primary" style="margin-top:20px" onclick="go(\'review\')">'+t("back2")+'</button></div>';
  }
  m.innerHTML = h;
}

function pickGroup(g){ S.group=g; const l=lines(g); if(l.length===1){ pickLine(l[0].lEN); } else go("lines"); }
function pickLine(l){ S.line=l; const o=opts(S.group,l); if(o.length===1){ pickSku(o[0].sku); } else go("options"); }
function pickSku(s){ S.sku=s; S.qty=1; go("qty"); }
function setQty(d){ S.qty=Math.max(1,S.qty+d); render(); }
function typeQty(v){ const n=parseInt(v,10); S.qty=(isNaN(n)||n<1)?1:n; render(); }

$("back").onclick=()=>{
  if(S.screen==="review") go("checkout");
  else if(S.screen==="checkout") go("cart");
  else if(S.screen==="cart") go("groups");
  else if(S.screen==="qty") go(opts(S.group,S.line).length>1?"options":(lines(S.group).length>1?"lines":"groups"));
  else if(S.screen==="options") go(lines(S.group).length>1?"lines":"groups");
  else go("groups");
};
$("langBtn").onclick=()=>{ S.lang = S.lang==="th"?"en":"th"; render(); };
$("cartBtn").onclick=()=>go("cart");


function readForm(){
  const g=(id)=>{const e=$(id);return e?e.value.trim():"";};
  S.f.nm=g("f_nm"); S.f.ph=g("f_ph"); S.f.addr=g("f_addr"); S.f.note=g("f_note");
  const c=$("f_con"); if(c) S.f.consent=c.checked;
}
function setType(v){ readForm(); S.f.otype=v; render(); }
function toReview(){
  readForm(); S.err="";
  if(!S.f.nm) S.err=t("errnm");
  else if(!/^0[0-9]{8,9}$/.test(S.f.ph)) S.err=t("errph");
  else if(S.f.otype==="RETAIL" && !S.f.addr) S.err=t("erraddr");
  else if(!S.f.consent) S.err=t("errcon");
  if(S.err){ render(); window.scrollTo(0,0); return; }
  go("review");
}
function payload(){
  const w=cartWeight(), ship=shipFor(w);
  return {
    source:"liff", idToken:S.idToken||"", userId:(S.profile&&S.profile.userId)||"",
    displayName:(S.profile&&S.profile.displayName)||"", lang:S.lang,
    orderType:S.f.otype, name:S.f.nm, phone:S.f.ph, address:S.f.addr, note:S.f.note,
    consent:S.f.consent,
    items:S.cart.map(i=>({sku:i.sku,name:i.name,qty:i.qty,price:i.price,weight:i.weight})),
    subtotal:cartSum(), weight:Math.round(w*100)/100,
    shipping:(ship===null?0:ship), freightQuote:(ship===null),
    total:(ship===null?cartSum():grandTotal())
  };
}
async function submitOrder(){
  if(S.sending) return;
  const body = payload();
  if(MAKE_WEBHOOK_URL.indexOf("PASTE")===0){
    console.log("PAYLOAD (not sent):", JSON.stringify(body,null,2));
    alert(t("notwired")+"\n\n"+JSON.stringify(body,null,2).slice(0,900));
    return;
  }
  S.sending=true; render();
  try{
    const res = await fetch(MAKE_WEBHOOK_URL,{method:"POST",
      headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
    if(!res.ok) throw new Error("HTTP "+res.status);
    S.sending=false; S.cart=[]; go("done");
  }catch(e){
    S.sending=false; S.err=String(e); go("fail");
  }
}
function closeApp(){ try{ if(liff.isInClient()) liff.closeWindow(); }catch(e){} }

(async function main(){
  await loadCatalogue();
  try{
    if(LIFF_ID.indexOf("PASTE")!==0){
      await liff.init({liffId:LIFF_ID});
      if(liff.isLoggedIn()){ S.profile = await liff.getProfile(); S.idToken = liff.getIDToken(); }
    }
  }catch(e){}
  render();
})();
</script>
</body>
</html>
