<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CharTech — LIFF Test</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --line: #e2e2e2;
    --ok: #1a7f37;
    --bad: #b42318;
    --card: #f7f7f5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141414; --fg: #f0f0f0; --muted: #a0a0a0;
      --line: #2e2e2e; --card: #1f1f1f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--fg);
    line-height: 1.6; max-width: 640px; margin-inline: auto;
  }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 20px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px; margin-bottom: 12px;
  }
  .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .value { font-size: 0.95rem; word-break: break-all; margin-top: 3px; font-family: ui-monospace, Menlo, monospace; }
  .ok { color: var(--ok); font-weight: 600; }
  .bad { color: var(--bad); font-weight: 600; }
  img.avatar { width: 56px; height: 56px; border-radius: 50%; margin-top: 8px; }
</style>
</head>
<body>

<h1>CharTech — LIFF Test</h1>
<div class="sub">หน้าทดสอบระบบ / Diagnostic page. Not the order form.</div>

<div class="card">
  <div class="label">LIFF Status</div>
  <div class="value" id="status">initialising…</div>
</div>

<div class="card">
  <div class="label">Opened inside LINE?</div>
  <div class="value" id="inclient">—</div>
</div>

<div class="card">
  <div class="label">Logged in?</div>
  <div class="value" id="loggedin">—</div>
</div>

<div class="card">
  <div class="label">User ID <span style="text-transform:none">(this is what we need)</span></div>
  <div class="value" id="userid">—</div>
</div>

<div class="card">
  <div class="label">Display name</div>
  <div class="value" id="name">—</div>
  <img class="avatar" id="pic" style="display:none" alt="">
</div>

<div class="card">
  <div class="label">OS / LIFF version</div>
  <div class="value" id="env">—</div>
</div>

<script>
// ─── REPLACE THIS with your LIFF ID from step 10.5 ───
const LIFF_ID = "2011686391-JIg8JWF5";
// ──────────────────────────────────────────────────────

const $ = (id) => document.getElementById(id);

async function main() {
  if (LIFF_ID === "PASTE_YOUR_LIFF_ID_HERE") {
    $("status").innerHTML = '<span class="bad">LIFF ID not set — edit index.html line 71</span>';
    return;
  }

  try {
    await liff.init({ liffId: LIFF_ID });
    $("status").innerHTML = '<span class="ok">init OK</span>';

    const inClient = liff.isInClient();
    $("inclient").innerHTML = inClient
      ? '<span class="ok">yes</span>'
      : '<span class="bad">no — opened in a normal browser</span>';

    $("env").textContent = liff.getOS() + " / LIFF " + liff.getVersion();

    if (!liff.isLoggedIn()) {
      $("loggedin").innerHTML = '<span class="bad">no</span>';
      $("userid").innerHTML = '<span class="bad">unavailable until login</span>';
      if (!inClient) liff.login();
      return;
    }

    $("loggedin").innerHTML = '<span class="ok">yes</span>';

    const profile = await liff.getProfile();
    $("userid").innerHTML = '<span class="ok">' + profile.userId + '</span>';
    $("name").textContent = profile.displayName;
    if (profile.pictureUrl) {
      $("pic").src = profile.pictureUrl;
      $("pic").style.display = "block";
    }
  } catch (err) {
    $("status").innerHTML = '<span class="bad">' + err + '</span>';
  }
}

main();
</script>

</body>
</html>
